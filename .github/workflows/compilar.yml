name: Compilar mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Extraer proyecto
        run: |
          echo "" | base64 -d > p.zip
          unzip -q p.zip
      - name: Compilar
        working-directory: autotranslate
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: autotranslate-jar
          path: autotranslate/build/libs/*.jar
